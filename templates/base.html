<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLES}}
</style>
</head>
<body class="{{BODY_CLASS}}">
  <!-- The four-layer model: paper / content / mark / wear. Text stays real text. -->
  <article class="sheet {{SHEET_CLASS}}">
    <div class="layer-paper" aria-hidden="true"></div>

    <div class="layer-content">
{{CONTENT}}
    </div>

    <div class="layer-mark" aria-hidden="true">
{{MARKS}}
    </div>

    <div class="layer-wear" aria-hidden="true">
{{WEAR}}
    </div>
  </article>
</body>
</html>
